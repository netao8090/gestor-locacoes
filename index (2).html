<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Gestor de Locações</title><style>body{margin:0;background:#101114;color:#f6f6f6;font:15px Arial,sans-serif}header{padding:22px;background:#191b20;border-bottom:2px solid #f4c542}h1{margin:0;color:#f4c542}main{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button{border:0;border-radius:9px;background:#f4c542;color:#171717;padding:11px 15px;font-weight:bold;cursor:pointer}.nav button{background:#292c33;color:white}.nav button.active{background:#f4c542;color:#111}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:#1c1f25;padding:20px;border-radius:12px;margin-bottom:16px}.card strong{font-size:27px;color:#f4c542;display:block;margin-top:10px}input,select,textarea{background:#2a2d35;border:1px solid #51545a;color:white;border-radius:7px;padding:11px;box-sizing:border-box;max-width:100%;width:100%}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}form button{align-self:end}table{border-collapse:collapse;width:100%;min-width:520px}td,th{padding:12px;text-align:left;border-bottom:1px solid #383b42}.scroll{overflow-x:auto}.muted{color:#adb0b8}.danger{background:#e16e6e}.hidden{display:none}h2{margin-top:4px}small{color:#aaa}</style></head><body><header><h1>Gestor de Locações</h1><small>Dashboard • mesas, cadeiras e jogos completos</small></header><main><div class="nav" id="nav"></div><div id="view"></div><p class="muted">Os dados ficam salvos neste navegador. Para usar os mesmos dados em outro aparelho, exporte e importe o backup. Para sincronização automática entre aparelhos, é necessário um servidor.</p></main><script>
const K='gestor_locacoes_web_v1';let db=JSON.parse(localStorage.getItem(K)||'{"clientes":[],"produtos":[],"locacoes":[],"despesas":[]}');let tab='Início';const tabs=['Início','Locações','Clientes','Estoque','Financeiro','Backup'];const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(db)),money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now()+Math.floor(Math.random()*10000),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),days=(a,b)=>Math.max(1,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)),pct=d=>d<=1?0:10+(d-2)*5,active=l=>!l.devolvida,used=(type)=>db.locacoes.filter(active).flatMap(l=>l.itens||[]).reduce((s,i)=>s+(i.tipo===type?Number(i.qtd):0),0),stock=t=>db.produtos.filter(p=>p.tipo===t).reduce((s,p)=>s+Number(p.qtd),0)-used(t),games=()=>Math.max(0,Math.min(stock('mesa'),Math.floor(stock('cadeira')/4)));function draw(){ $('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';draw()">${t}</button>`).join('');let v='';if(tab==='Início'){let rec=db.locacoes.reduce((s,l)=>s+(l.pago||0),0),exp=db.despesas.reduce((s,d)=>s+Number(d.valor),0);v=`<div class="cards">${[['Locações em aberto',db.locacoes.filter(active).length],['Jogos disponíveis',games()],['Mesas disponíveis',Math.max(0,stock('mesa'))],['Cadeiras disponíveis',Math.max(0,stock('cadeira'))],['Recebido',money(rec)],['Saldo',money(rec-exp)]].map(([a,b])=>`<div class="card">${a}<strong>${b}</strong></div>`).join('')}</div><div class="panel"><h2>Últimas locações</h2>${rents(5)}</div>`}if(tab==='Clientes')v=`<div class="panel"><h2>Novo cliente</h2><form onsubmit="addClient(event)"><input name="nome" placeholder="Nome" required><input name="telefone" placeholder="Telefone"><input name="endereco" placeholder="Endereço"><button>Adicionar cliente</button></form></div><div class="panel"><h2>Clientes</h2>${table(['Nome','Telefone','Endereço',''],db.clientes.map(c=>[esc(c.nome),esc(c.telefone),esc(c.endereco),del('clientes',c.id)]))}</div>`;if(tab==='Estoque')v=`<div class="cards">${[['Mesas',stock('mesa')],['Cadeiras',stock('cadeira')],['Jogos completos',games()]].map(([a,b])=>`<div class="card">${a}<strong>${Math.max(0,b)}</strong></div>`).join('')}</div><div class="panel"><h2>Cadastrar produto</h2><form onsubmit="addProduct(event)"><input name="nome" placeholder="Descrição" required><select name="tipo"><option value="mesa">Mesa</option><option value="cadeira">Cadeira</option><option value="outro">Outro</option></select><input type="number" name="qtd" min="0" placeholder="Quantidade" required><input type="number" name="preco" step="0.01" min="0" placeholder="Diária R$" required><button>Adicionar</button></form></div><div class="panel"><h2>Produtos</h2>${table(['Nome','Tipo','Quantidade','Diária',''],db.produtos.map(p=>[esc(p.nome),esc(p.tipo),p.qtd,money(p.preco),del('produtos',p.id)]))}</div>`;if(tab==='Locações')v=`<div class="panel"><h2>Nova locação</h2><form onsubmit="addRent(event)"><select name="cliente" required><option value="">Selecione o cliente</option>${db.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select><input type="date" name="inicio" value="${today()}" required><input type="date" name="fim" value="${today()}" required><input name="endereco" placeholder="Endereço de entrega"><select name="produto" required><option value="">Selecione o produto</option>${db.produtos.map(p=>`<option value="${p.id}">${esc(p.nome)} (${p.tipo})</option>`).join('')}</select><input type="number" name="qtd" min="1" placeholder="Quantidade" required><button>Registrar locação</button></form><small>O valor é calculado pela diária cadastrada e acréscimo de 10% no segundo dia, mais 5 pontos percentuais por dia adicional.</small></div><div class="panel"><h2>Locações</h2>${rents()}</div>`;if(tab==='Financeiro'){let month=new Date().toISOString().slice(0,7),payments=db.locacoes.flatMap(l=>l.pagamentos||[]),rec=payments.filter(p=>p.data.startsWith(month)).reduce((s,p)=>s+Number(p.valor),0),exp=db.despesas.filter(d=>d.data.startsWith(month)).reduce((s,d)=>s+Number(d.valor),0);v=`<div class="cards">${[['Recebido no mês',money(rec)],['Despesas no mês',money(exp)],['Saldo do mês',money(rec-exp)]].map(([a,b])=>`<div class="card">${a}<strong>${b}</strong></div>`).join('')}</div><div class="panel"><h2>Nova despesa</h2><form onsubmit="addExpense(event)"><input name="descricao" placeholder="Descrição" required><input type="number" step="0.01" min="0.01" name="valor" placeholder="Valor" required><input type="date" name="data" value="${today()}" required><button>Adicionar despesa</button></form></div><div class="panel"><h2>Despesas</h2>${table(['Data','Descrição','Valor',''],db.despesas.map(d=>[d.data,esc(d.descricao),money(d.valor),del('despesas',d.id)]))}</div>`}if(tab==='Backup')v=`<div class="panel"><h2>Exportar e importar</h2><p>Salve um arquivo de backup para transportar os dados entre aparelhos.</p><button onclick="backup()">Baixar backup JSON</button><p><input type="file" accept="application/json" onchange="restore(event)"></p></div>`;$('view').innerHTML=v}function table(h,rows){return `<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="muted">Nenhum registro</td></tr>`}</tbody></table></div>`}function del(t,id){return `<button class="danger" onclick="remove('${t}',${id})">Excluir</button>`}function remove(t,id){if(!confirm('Excluir este registro?'))return;db[t]=db[t].filter(x=>x.id!==id);save();draw()}function addClient(e){e.preventDefault();let f=e.target;db.clientes.push({id:uid(),nome:f.nome.value,telefone:f.telefone.value,endereco:f.endereco.value});save();draw()}function addProduct(e){e.preventDefault();let f=e.target;db.produtos.push({id:uid(),nome:f.nome.value,tipo:f.tipo.value,qtd:+f.qtd.value,preco:+f.preco.value});save();draw()}function addRent(e){e.preventDefault();let f=e.target,p=db.produtos.find(p=>p.id==f.produto.value),c=db.clientes.find(c=>c.id==f.cliente.value),q=+f.qtd.value,d=days(f.inicio.value,f.fim.value);if(f.fim.value<f.inicio.value)return alert('Data de devolução anterior à retirada');let available=stock(p.tipo);if(q>available)return alert('Estoque insuficiente: '+available+' disponível(is)');let total=Math.round(p.preco*q*(1+pct(d)/100)*100)/100;db.locacoes.push({id:uid(),cliente:c.nome,clienteId:c.id,endereco:f.endereco.value||c.endereco,inicio:f.inicio.value,fim:f.fim.value,itens:[{id:p.id,nome:p.nome,tipo:p.tipo,qtd:q}],total,pago:0,pagamentos:[],devolvida:false});save();draw()}function rents(limit){let rows=[...db.locacoes].reverse();if(limit)rows=rows.slice(0,limit);return table(['Cliente','Período','Itens','Valor','Pago','Situação','Ações'],rows.map(l=>[esc(l.cliente),l.inicio+' a '+l.fim,(l.itens||[]).map(i=>`${i.qtd}× ${esc(i.nome)}`).join(', '),money(l.total),money(l.pago),l.devolvida?'Devolvida':'Em aberto',`<button onclick="pay(${l.id})">Pagamento</button> <button onclick="finish(${l.id})" ${l.devolvida?'disabled':''}>Devolver</button>`]))}function pay(id){let l=db.locacoes.find(x=>x.id===id),v=Number(prompt('Valor recebido (R$):',Math.max(0,l.total-l.pago).toFixed(2)));if(!Number.isFinite(v)||v<=0)return; l.pago=Math.round((l.pago+v)*100)/100;l.pagamentos.push({data:today(),valor:v});save();draw()}function finish(id){let l=db.locacoes.find(x=>x.id===id);if(confirm('Confirmar devolução?')){l.devolvida=true;save();draw()}}function addExpense(e){e.preventDefault();let f=e.target;db.despesas.push({id:uid(),descricao:f.descricao.value,valor:+f.valor.value,data:f.data.value});save();draw()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-gestor-locacoes.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let file=e.target.files[0];if(!file)return;file.text().then(t=>{let d=JSON.parse(t);if(!['clientes','produtos','locacoes','despesas'].every(k=>Array.isArray(d[k])))throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelo backup?')){db=d;save();draw()}}).catch(err=>alert('Erro no arquivo: '+err.message))}draw();</script></body></html>
